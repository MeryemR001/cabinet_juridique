<style>
  #sidebar, #sidebar *{font-family:'Public Sans',sans-serif !important;}
  #sidebar .material-symbols-outlined{font-family:'Material Symbols Outlined' !important;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24 !important;}
  #sidebar .headline{font-family:'Newsreader',serif !important;}
  #sidebar .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;}
  #sidebar .nav-item{display:flex;align-items:center;padding:11px 20px;color:rgba(255,255,255,.6);transition:all .2s;cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;text-decoration:none;gap:10px;}
  #sidebar .nav-item .material-symbols-outlined{font-size:18px;}
  #sidebar .nav-item:hover{color:#fff;background:rgba(255,255,255,.05);}
  #sidebar .nav-item.active{color:#FED255;background:rgba(255,255,255,.1);border-left:3px solid #FED255;}
</style>

<aside id="sidebar" style="background:#1B2A41;display:flex;flex-direction:column;height:100vh;width:240px;flex-shrink:0;overflow:hidden;position:sticky;top:0;">
  <div style="padding:20px 18px 14px;border-bottom:0.5px solid rgba(255,255,255,.08);">
    <div style="display:flex;align-items:center;gap:9px;">
      <span class="material-symbols-outlined" style="color:#FED255;font-size:20px;">balance</span>
      <div>
        <div class="headline" style="color:#fff;font-size:17px;font-weight:700;">Lex Juris</div>
        <div style="color:rgba(254,210,85,.7);font-size:9px;letter-spacing:.2em;text-transform:uppercase;">Distilled Authority</div>
      </div>
    </div>
  </div>

  <nav style="flex:1;padding:6px 0;overflow-y:auto;min-height:0;">
    {% for item in sidebar_items %}
      <a href="{{ item.url }}" class="nav-item{% if item.active %} active{% endif %}">
        <span class="material-symbols-outlined">{{ item.icon }}</span>{{ item.label }}
      </a>
    {% endfor %}
  </nav>

  <div style="padding:12px 10px;border-top:0.5px solid rgba(255,255,255,.08);">
    <button onclick="toggleDark()" style="width:100%;background:rgba(255,255,255,.08);border:0.5px solid rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:7px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;font-family:'Public Sans',sans-serif;">
      <span class="material-symbols-outlined" id="theme-ico" style="font-size:16px;">dark_mode</span>
      <span id="theme-lbl">Dark Mode</span>
    </button>
    <div style="display:flex;align-items:center;gap:9px;padding-top:9px;border-top:0.5px solid rgba(255,255,255,.08);">
      <div class="avatar" style="background:#c9a227;color:#fff;width:30px;height:30px;font-size:11px;">
        {{ request.user.first_name|first }}{{ request.user.last_name|first }}
      </div>
      <div>
        <div style="color:#fff;font-size:12px;font-weight:600;">{{ request.user.get_full_name }}</div>
        <div style="color:rgba(255,255,255,.45);font-size:10px;text-transform:uppercase;letter-spacing:.07em;">{{ sidebar_role_label }}</div>
      </div>
    </div>
    <a href="{% url 'utilisateurs:logout' %}" style="display:flex;align-items:center;gap:7px;margin-top:10px;color:rgba(255,255,255,.5);font-size:11px;text-decoration:none;padding:6px;border-radius:6px;transition:background .2s;"
      onmouseover="this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.background='none'">
      <span class="material-symbols-outlined" style="font-size:16px;">logout</span>Déconnexion
    </a>
  </div>
</aside>

<script>
if (typeof window.toggleDark !== 'function') {
  window.toggleDark = function () {
    const html = document.documentElement;
    const isDark = !html.classList.contains('dark');
    html.classList.toggle('dark', isDark);
    const icon = document.getElementById('theme-ico');
    const label = document.getElementById('theme-lbl');
    if (icon) icon.textContent = isDark ? 'light_mode' : 'dark_mode';
    if (label) label.textContent = isDark ? 'Light Mode' : 'Dark Mode';
  };
}
</script>
