<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,300;1,6..72,400&family=Public+Sans:wght@300;400;500;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap');

  html,
  body,
  input,
  select,
  textarea,
  button {
    font-family: 'Public Sans', sans-serif;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  .headline,
  .font-headline {
    font-family: 'Newsreader', serif;
  }

  /* Elegant editorial heading style across pages. */
  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  .font-headline,
  .headline {
    font-style: italic;
    letter-spacing: -0.01em;
  }

  /* Keep sidebar branding/nav crisp and non-italic. */
  #sidebar .headline,
  #sidebar .nav-item,
  #sidebar .nav-item * {
    font-style: normal !important;
    letter-spacing: 0.08em;
  }

  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }

  /* Route-scoped typography fix for legacy heavy templates. */
  body.typography-normalized {
    font-weight: 400 !important;
  }

  body.typography-normalized h1,
  body.typography-normalized h2,
  body.typography-normalized h3,
  body.typography-normalized h4,
  body.typography-normalized h5,
  body.typography-normalized h6,
  body.typography-normalized .headline,
  body.typography-normalized .font-headline {
    font-weight: 600 !important;
  }

  body.typography-normalized .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24 !important;
  }

  body.typography-normalized .status-badge,
  body.typography-normalized .badge,
  body.typography-normalized .btn-primary,
  body.typography-normalized .btn-secondary,
  body.typography-normalized .nav-item {
    font-weight: 500 !important;
  }

  body.typography-normalized [style*='font-weight:700'] {
    font-weight: 600 !important;
  }
</style>
<script>
  (function () {
    var path = window.location.pathname || '';
    var shouldNormalize =
      path.startsWith('/dashboard/') ||
      path.startsWith('/dossiers/') ||
      path.startsWith('/audiences/');

    if (!shouldNormalize) {
      return;
    }

    function applyClass() {
      if (document.body) {
        document.body.classList.add('typography-normalized');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applyClass);
    } else {
      applyClass();
    }
  })();
</script>
